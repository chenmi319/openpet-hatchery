[project]
name = "openpet-hatchery"
version = "0.1.0"
description = "OpenCode skills and reproducible assets for OpenPets pets"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "openai>=2.11,<3",
  "pillow>=11,<13",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "ruff>=0.17.1",
]
